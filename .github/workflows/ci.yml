name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: node -v
      - run: npm -v
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run package
