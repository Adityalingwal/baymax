<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Strict-ish CSP: renderer talks only to itself; all network calls live in the main process. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <title>Baymax</title>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
